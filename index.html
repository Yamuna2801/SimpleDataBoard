<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Data Board</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="grid-container">
    <div class="form-container">
      <h1>Data Board Form</h1>
      <form id="data-board-form"> 
        <label>Name: </label><br>
        <input type="text" id="name" placeholder="Type your name" required><br><br>

        <label>Age: </label><br>
        <input type="number" id="age" placeholder="Your age" required><br><br>

        <label>DOB: </label><br>
        <input type="date" id="dob" required><br><br>

        <label>Email ID: </label><br>
        <input type="email" id="email-id" placeholder="Email ID" required><br><br>

        <label>Phone Number: </label><br>
        <input type="tel" id="phone-number" placeholder="Number" required><br><br>

        <button type="submit">Submit</button>
      </form>
    </div>

    <div class="table-container">
      <h1>Data Board Table</h1>
      <table id="dataTable" border="1">
        <thead>
          <tr>
            <th>Name</th>
            <th>Age</th>
            <th>DOB</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>

  <script src="./index.js"></script>
</body>
</html>
